name: Build Windows app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", "catalog/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para adjuntar el .zip a la Release

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests del núcleo
        run: dotnet test windows/LibreStream.Core.Tests -c Release --logger "console;verbosity=normal"

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar (portable, autocontenido)
        shell: pwsh
        run: |
          # La versión de la etiqueta queda dentro de la app: con ella avisa de las versiones nuevas
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          dotnet publish windows/LibreStream.App -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} "-p:Version=$version" -o out/Nsound
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = (Get-Item out/Nsound/Nsound.dll).VersionInfo.ProductVersion
          if ($built.Split('+')[0] -ne $version) { Write-Error "La app lleva la versión '$built' y debía llevar '$version'"; exit 1 }

      - name: Empaquetar .zip
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          if (-not (Test-Path out/Nsound/Nsound.exe)) { Write-Error "No se generó Nsound.exe"; exit 1 }
          $zip = "Nsound-$version-windows-${{ matrix.arch }}.zip"
          # Orden del zip: arriba solo «Abrir Nsound» y un LEEME; todo lo demás dentro de app/ (idiomas recortados a español e inglés)
          Get-ChildItem out/Nsound -Directory | Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z0-9]+)+$' -and $_.Name -notmatch '^(es|en)-' } | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Path out/pkg | Out-Null
          Move-Item out/Nsound out/pkg/app
          Set-Content -Path "out/pkg/Abrir Nsound.cmd" -Encoding ascii -Value @('@echo off', 'start "" "%~dp0app\Nsound.exe"')
          Set-Content -Path "out/pkg/LEEME.txt" -Encoding ascii -Value @('Nsound', '1. Extrae todo el zip (clic derecho > Extraer todo).', '2. Abre "Abrir Nsound" (o app\Nsound.exe).', 'Si Windows avisa de que no reconoce la app: Mas informacion > Ejecutar de todos modos (es una beta sin firmar).')
          Compress-Archive -Path out/pkg/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Crear instalador (.exe)
        id: setup
        shell: pwsh
        run: |
          # Un solo archivo para quien no quiere zip: instala para el usuario (sin administrador), crea los accesos y se actualiza encima.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $src = (Resolve-Path out/pkg/app).Path
          $out = (Resolve-Path out).Path
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" "/DOutDir=$out" windows/installer/nsound.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "Nsound-$version-windows-${{ matrix.arch }}-setup.exe"
          if (-not (Test-Path "out/$exe")) { Write-Error "No se generó $exe"; exit 1 }
          Move-Item "out/$exe" $exe
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  $exe" | Out-File "$exe.sha256" -Encoding ascii
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-windows-${{ matrix.arch }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
            ${{ steps.setup.outputs.exe }}
            ${{ steps.setup.outputs.exe }}.sha256

      - name: Adjuntar a GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}   # v1.2.3-beta.1 → pre-lanzamiento
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
            ${{ steps.setup.outputs.exe }}
            ${{ steps.setup.outputs.exe }}.sha256
