name: Build Android APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**", "app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para adjuntar el .apk a la Release

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Interfaz compartida (tests y empaquetado)
        run: |
          node --test app/test/core.test.mjs app/test/update.test.mjs app/test/equalizer.test.mjs
          node app/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Versión creciente y firma fija: sin las dos, Android no deja instalar una versión encima de la anterior.
      # En los pull request los secretos se dejan vacíos a propósito.
      - name: Versión y firma
        id: ver
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"   # crece en cada ejecución de este flujo
          N=0
          for V in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -z "${!V}" ]] || N=$((N + 1))
          done
          if [[ $N -eq 4 ]]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nsound.p12"
            echo "keystore=$RUNNER_TEMP/nsound.p12" >> "$GITHUB_OUTPUT"
            echo "Firma: clave fija de Nsound."
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::Faltan secretos de firma ($N de 4). No se publica un APK que nadie podría actualizar. Ver docs/DESARROLLO.md."; exit 1
          elif [[ $N -ne 0 ]]; then
            echo "::error::Secretos de firma incompletos ($N de 4)."; exit 1
          else
            echo "::notice::Sin secretos de firma: APK de pruebas firmado con la clave de depuración."
          fi

      - name: Tests y compilación (APK instalable sin Play Store)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.ver.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.ver.outputs.keystore && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.ver.outputs.keystore && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.ver.outputs.keystore && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: >
          gradle --no-daemon testDebugUnitTest assembleRelease
          -PnsoundVersionCode=${{ steps.ver.outputs.code }}
          "-PnsoundVersionName=${{ steps.ver.outputs.name }}"

      - name: Nombrar el APK
        id: pkg
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nsound.p12"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          APK="Nsound-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          # Huella pública del certificado: tiene que ser la misma en todas las versiones publicadas
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --print-certs "$APK" | grep -i 'SHA-256'
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-android
          path: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.apk }}.sha256

      - name: Adjuntar a GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}   # v1.2.3-beta.1 → pre-lanzamiento
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.apk }}.sha256
