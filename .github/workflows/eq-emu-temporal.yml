name: "PRUEBA TEMPORAL ecualizador en emulador"

# Ahora solo compila el APK de depuración para medir en un móvil real (el emulador se desconectaba)
on:
  push:
    branches: ["claude/instalador-autoactualizable-6b9922"]
    paths: [".github/workflows/eq-emu-temporal.yml", "app/src/**"]

permissions:
  contents: read

jobs:
  depuracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node app/build.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar el APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-depuracion
          path: android/app/build/outputs/apk/debug/app-debug.apk
